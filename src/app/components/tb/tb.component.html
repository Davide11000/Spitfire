  <ion-menu contentId="main-content">
  
    <ion-header>
      <ion-toolbar>
        <ion-title >SpitFire</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item button>Home</ion-item>
        <ion-item button>Playlist</ion-item>
        <ion-item button>Newest</ion-item>
        <ion-item button>Discover</ion-item>
        <ion-item button class="ion-display-md-none">Sign in</ion-item>
      </ion-list>
    </ion-content>
  
  </ion-menu>

  <ion-header id="main-content">
    <ion-toolbar>

      @if (!isActive){
        <ion-buttons slot="start">
          <ion-menu-button class="ion-display-lg-none"></ion-menu-button>
          <div class="logo">SpitFire</div>
          <div class="divider"></div>
          <div id="desk-btn" class="ion-display-none ion-display-lg-block">
          <ion-button fill="clear" class="navbtn">Home</ion-button>
          <ion-button fill="clear" class="navbtn">Playlist</ion-button>
          <ion-button fill="clear" class="navbtn">Discover</ion-button>
          </div>
        </ion-buttons>
    
        <ion-searchbar slot="end" placeholder="Search..." showClearButton="focus" class="ion-display-none ion-display-sm-block" [autofocus]="true"></ion-searchbar>
    
        <ion-buttons slot="end" class="ion-display-sm-none">
            <ion-icon name="search" (click)="activateSearch()"></ion-icon>
        </ion-buttons>
      } @else {
        <ion-searchbar 
          class="mobile-searchbar"
          #mobileSearch
          placeholder="Search..."
          showClearButton="always"
          (ionClear)="isActive = false"
          style="max-width: 100%;"></ion-searchbar>
      }

      <ion-buttons slot="end">
        <ion-button fill="clear" class="ion-display-none ion-display-md-block navbtn">Sign in</ion-button>
      </ion-buttons>

    </ion-toolbar>
  </ion-header>
