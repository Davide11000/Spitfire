<div class="rating">
  <div class="stars" (mouseleave)="onLeave()">
    @for (n of stars; track n) {
      <ion-icon [name]="getIcon(n)" [class.on]="getIcon(n) !== 'star-outline'"
                (mousemove)="onMove($event, n)" (click)="onClick($event, n)"></ion-icon>
    }
  </div>

  <span class="info">
    @if (hover) {
      <b>{{ hover }}</b> / 5
    } @else {
      @if (count) {
        <b>{{ average | number:'1.2-2' }}</b> / 5.0 from
        <span class="count-link" title="Show the ratings" (click)="toggleChart()"><b>{{ count | number }}</b> {{ count === 1 ? 'rating' : 'ratings' }}</span>
      } @else {
        No ratings yet
      }
    }
  </span>

  @if (showChart) {
    <div class="backdrop" (click)="showChart = false"></div>
    <div class="chart-popup">
      <app-rating-chart [rows]="rows"></app-rating-chart>
    </div>
  }
</div>
