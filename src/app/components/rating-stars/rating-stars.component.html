<div class="rating-container">
  <span class="average-score">
    {{ votoMedio ? (votoMedio | number:'1.1-1') : '0.0' }}
  </span>

  <div class="stars-wrapper" (mouseleave)="resetHoverStella()">
    @for (n of [1, 2, 3, 4, 5]; track n) {
      <ion-icon
        [name]="getIconaStella(n) === 'full' ? 'star' : (getIconaStella(n) === 'half' ? 'star-half' : 'star-outline')"
        [class.active-star]="getIconaStella(n) !== 'empty'"
        (mousemove)="gestisciHoverStella($event, n)"
        (click)="inviaVotoStella($event, n)">
      </ion-icon>
    }
  </div>
</div>
