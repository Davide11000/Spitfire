<div class="rating">
  <div class="stars" (mouseleave)="onLeave()">
    @for (n of stars; track n) {
      <ion-icon [name]="getIcon(n)" [class.on]="getIcon(n) !== 'star-outline'"
                (mousemove)="onMove($event, n)" (click)="onClick($event, n)"></ion-icon>
    }
  </div>

  <span class="info">
    @if (hover) {
      <b>{{ hover }}</b> / 5
    } @else {
      @if (count) {
        <b>{{ average | number:'1.2-2' }}</b> / 5.0 from <b>{{ count | number }}</b> {{ count === 1 ? 'rating' : 'ratings' }}
      } @else {
        No ratings yet
      }
    }
  </span>
</div>
