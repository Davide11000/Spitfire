@if (contributors.length > 0) {
  <div class="contributors">
    <ion-button class="plain toggle" (click)="open = !open"><span class="bc">
      <ion-icon name="people-outline"></ion-icon>
      {{ contributors.length }} {{ contributors.length === 1 ? 'contributor' : 'contributors' }}
      <ion-icon [name]="open ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
    </span></ion-button>

    @if (open) {
      <div class="list">
        @for (c of contributors; track c.username) {
          <ion-button class="plain user" (click)="goToProfile(c.username)"><span class="bc">
            <img [src]="getPhoto(c.foto_profilo)" />
            <span>{{ '@' + c.username }}</span>
          </span></ion-button>
        }
      </div>
    }
  </div>
}
