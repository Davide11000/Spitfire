<app-navbar></app-navbar>

<ion-content class="global theme-light">
  <div class="log">
    <ion-text class="ttl">
      <h1 class="upper-text">Login</h1>
    </ion-text>
    <div class="input">
      <ion-input label="Username or Email" type="text" label-placement="stacked" fill="outline" [(ngModel)]="id"></ion-input>
      <ion-input label="Password" type="password" label-placement="stacked" fill="outline" [(ngModel)]="password">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
      @if (errorMessage) {
        <ion-text color="danger">
          <p>{{errorMessage}}</p>
        </ion-text>
      }
      <a class="forgot" routerLink="/forgot-password">Forgot password?</a>
      <ion-button class="square-btn" fill="outline" [disabled]="sending" (click)="onLogin()">@if (sending) { <ion-spinner name="crescent" class="btn-spinner"></ion-spinner> } @else { Continue }</ion-button>
      <ion-text>
        <p class="or">or</p>
      </ion-text>
    </div>
    <div class="reg">
      <ion-text>
        <h1 class="no-acc">Don't have an account?</h1>
      </ion-text>
      <ion-button class="sign-up" fill="clear" routerLink="/register">Sign up</ion-button>
    </div>
  </div>
  <app-footer></app-footer>
</ion-content>
