<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        @if (user) {
          <ion-card class="profile-card">
            <div class="profile-header">
              <ion-img [src]="'https://ionicframework.com/docs/img/demos/avatar.svg'"></ion-img>
              <div class="profile-info">
                <div class="username">
                  @{{user.username}}
                </div>
                <div class="stats">
                   <span><strong>{{followersCount}}</strong> Followers</span>
                   <span><strong>{{followingCount}}</strong> Following</span>
                </div>
                <div class="actions">
                  @if (isOwnProfile) {
                    <ion-button fill="outline" class="action-btn">Edit profile</ion-button>
                    <ion-button fill="outline" color="danger" class="action-btn" (click)="onLogout()">Logout</ion-button>
                  } @else {
                    <ion-button fill="outline" class="action-btn" (click)="onFollow()">{{ isFollowing ? 'Unfollow' : 'Follow' }}</ion-button>
                  }
                </div>
              </div>
            </div>
          </ion-card>
        } @else {
          <ion-spinner name="crescent"></ion-spinner>
        }
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
