<app-navbar></app-navbar>

<ion-content class="global theme-light">
  <div class="log">
    <ion-text class="ttl">
      <h1 class="upper-text">Forgot password</h1>
    </ion-text>
    <div class="input">
      <p class="info">Write the email of your account: we will send you a link to choose a new password.</p>
      <ion-input label="Email" type="email" label-placement="stacked" fill="outline" [(ngModel)]="email"></ion-input>
      @if (errorMessage) {
        <ion-text color="danger">
          <p>{{ errorMessage }}</p>
        </ion-text>
      }
      @if (message) {
        <ion-text color="success">
          <p>{{ message }}</p>
        </ion-text>
      }
      <ion-button class="square-btn" fill="outline" [disabled]="sending" (click)="onSend()">@if (sending) { <ion-spinner name="crescent" class="btn-spinner"></ion-spinner> } @else { Send link }</ion-button>
    </div>
    <div class="reg">
      <ion-button class="sign-up" fill="clear" routerLink="/login">Back to login</ion-button>
    </div>
  </div>
</ion-content>
