<app-navbar></app-navbar>

<ion-content class="global theme-light">
  <div class="log">
    <ion-text class="ttl">
      <h1 class="upper-text">New password</h1>
    </ion-text>
    <div class="input">
      @if (!token) {
        <p class="info">This link is not valid. Ask for a new one.</p>
        <ion-button class="square-btn" fill="outline" routerLink="/forgot-password">Forgot password</ion-button>
      } @else if (done) {
        <p class="info">Your password has been changed. You can now login.</p>
        <ion-button class="square-btn" fill="outline" routerLink="/login">Login</ion-button>
      } @else {
        <ion-input label="New password" type="password" label-placement="stacked" fill="outline" [(ngModel)]="password">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
        <ion-input label="Confirm password" type="password" label-placement="stacked" fill="outline" [(ngModel)]="confirm">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
        @if (errorMessage) {
          <ion-text color="danger">
            <p>{{ errorMessage }}</p>
          </ion-text>
        }
        <ion-button class="square-btn" fill="outline" [disabled]="sending" (click)="onReset()">@if (sending) { <ion-spinner name="crescent" class="btn-spinner"></ion-spinner> } @else { Change password }</ion-button>
      }
    </div>
  </div>
</ion-content>
